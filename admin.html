<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINDpos License Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    input::placeholder { color: #e8eaed; opacity: 0.45; }
    input:focus { outline: none; border-color: #86efac !important; }
    #customer-list::-webkit-scrollbar { width: 4px; }
    #customer-list::-webkit-scrollbar-track { background: #22252a; }
    #customer-list::-webkit-scrollbar-thumb { background: #5a5f66; border-radius: 2px; }
  </style>
</head>
<body>

<div id="shell" style="display:flex; flex-direction:column; height:100vh; background:#383c42; color:#e8eaed; font-family:'JetBrains Mono',monospace;">

  <!-- HEADER -->
  <div id="header" style="height:44px; background:#2e3236; border-bottom:1px solid #5a5f66; display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0;">
    <div style="display:flex; align-items:center; gap:6px; font-size:13px;">
      <span style="color:#86efac; font-weight:600; letter-spacing:0.06em;">KINDPOS</span>
      <span style="color:#5a5f66;">·</span>
      <span style="color:#e8eaed;">License Admin</span>
    </div>
    <div style="background:#4ade80; color:#22252a; font-size:10px; font-weight:700; padding:2px 7px; border-radius:3px; letter-spacing:0.08em;">LIVE</div>
  </div>

  <!-- BODY -->
  <div id="body" style="display:flex; flex:1; overflow:hidden;">

    <!-- SIDEBAR -->
    <div id="sidebar" style="width:200px; background:#22252a; border-right:1px solid #5a5f66; display:flex; flex-direction:column; flex-shrink:0;">

      <!-- Search bar -->
      <div style="padding:8px; border-bottom:1px solid #5a5f66; flex-shrink:0;">
        <input
          id="customer-search"
          type="text"
          placeholder="Search customers..."
          style="width:100%; background:#2e3236; border:1px solid #5a5f66; border-radius:4px; color:#e8eaed; font-family:'JetBrains Mono',monospace; font-size:11px; padding:5px 8px;"
        >
      </div>

      <!-- Customer list -->
      <div id="customer-list" style="flex:1; overflow-y:auto;">
        <div style="color:#e8eaed; text-align:center; padding:20px 12px; font-size:11px;">Loading...</div>
      </div>

      <!-- New customer (pinned) -->
      <div
        id="new-customer-btn"
        style="border-top:1px solid #5a5f66; padding:10px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; color:#e8eaed; font-size:12px; flex-shrink:0; background:transparent;"
        onmouseenter="this.style.background='#2e3236'"
        onmouseleave="this.style.background='transparent'"
        onclick="console.log('new customer')"
      >
        <span style="font-size:16px; line-height:1;">+</span>
        <span>New customer</span>
      </div>

    </div>

    <!-- MAIN (empty placeholder) -->
    <div id="main" style="flex:1; background:#383c42;"></div>

  </div>
</div>

<script>
  const ADMIN_SECRET = 'Fr76X5Rt5#@!';
  const API = 'https://kindpos.com';

  let allCustomers = [];
  let activeRef = null;

  function displayRef(store_ref) {
    return store_ref === '' ? 'UNGROUPED' : store_ref;
  }

  function sortCustomers(list) {
    return [...list].sort((a, b) => {
      if (a.store_ref === '' && b.store_ref !== '') return 1;
      if (a.store_ref !== '' && b.store_ref === '') return -1;
      return a.store_ref.localeCompare(b.store_ref);
    });
  }

  function renderCustomers(customers) {
    const listEl = document.getElementById('customer-list');
    listEl.innerHTML = '';

    if (customers.length === 0) {
      listEl.innerHTML = '<div style="color:#e8eaed; text-align:center; padding:20px 12px; font-size:11px;">No results</div>';
      return;
    }

    customers.forEach(c => {
      const ref = displayRef(c.store_ref);
      const termCount = Array.isArray(c.terminals) ? c.terminals.length : 0;
      const termLabel = termCount === 1 ? '1 terminal' : `${termCount} terminals`;
      const bottomLine = c.store_name ? `${c.store_name} · ${termLabel}` : termLabel;
      const isActive = c.store_ref === activeRef;

      const tab = document.createElement('div');
      tab.className = 'customer-tab';
      tab.dataset.ref = c.store_ref;
      tab.style.cssText = [
        'padding:10px 12px',
        `border-left:3px solid ${isActive ? '#86efac' : 'transparent'}`,
        'border-bottom:1px solid #2e3236',
        'cursor:pointer',
        `background:${isActive ? '#383c42' : 'transparent'}`,
      ].join(';');

      tab.innerHTML = `
        <div style="color:#86efac; font-size:11px; letter-spacing:0.06em; font-weight:500;">${ref}</div>
        <div style="color:#e8eaed; font-size:10px; margin-top:3px; opacity:0.75;">${bottomLine}</div>
      `;

      tab.addEventListener('mouseenter', () => {
        if (c.store_ref !== activeRef) tab.style.background = '#2e3236';
      });
      tab.addEventListener('mouseleave', () => {
        if (c.store_ref !== activeRef) tab.style.background = 'transparent';
      });
      tab.addEventListener('click', () => {
        activeRef = c.store_ref;
        document.querySelectorAll('.customer-tab').forEach(t => {
          t.style.background = 'transparent';
          t.style.borderLeftColor = 'transparent';
        });
        tab.style.background = '#383c42';
        tab.style.borderLeftColor = '#86efac';
        console.log(c.store_ref);
      });

      listEl.appendChild(tab);
    });
  }

  document.getElementById('customer-search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    const filtered = q
      ? allCustomers.filter(c =>
          c.store_ref.toLowerCase().includes(q) ||
          (c.store_name && c.store_name.toLowerCase().includes(q))
        )
      : allCustomers;
    renderCustomers(sortCustomers(filtered));
  });

  async function loadCustomers() {
    try {
      const res = await fetch(`${API}/api/admin/customers`, {
        headers: { Authorization: `Bearer ${ADMIN_SECRET}` }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      const data = await res.json();
      allCustomers = data.customers || [];
      renderCustomers(sortCustomers(allCustomers));
    } catch (err) {
      const listEl = document.getElementById('customer-list');
      listEl.innerHTML = `<div style="color:#e8472a; text-align:center; padding:20px 12px; font-size:11px;">${err.message}</div>`;
    }
  }

  loadCustomers();
</script>

</body>
</html>
