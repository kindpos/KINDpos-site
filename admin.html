<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINDpos License Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    input::placeholder { color: #e8eaed; opacity: 0.45; }
    input:focus { outline: none; border-color: #86efac !important; }
    #customer-list::-webkit-scrollbar { width: 4px; }
    #customer-list::-webkit-scrollbar-track { background: #22252a; }
    #customer-list::-webkit-scrollbar-thumb { background: #5a5f66; border-radius: 2px; }
    #terminal-cards::-webkit-scrollbar { width: 4px; }
    #terminal-cards::-webkit-scrollbar-track { background: #383c42; }
    #terminal-cards::-webkit-scrollbar-thumb { background: #5a5f66; border-radius: 2px; }
    #overlay-panel::-webkit-scrollbar { width: 4px; }
    #overlay-panel::-webkit-scrollbar-track { background: #2e3236; }
    #overlay-panel::-webkit-scrollbar-thumb { background: #5a5f66; border-radius: 2px; }
    input[readonly]:focus { border-color: #5a5f66 !important; }
  </style>
</head>
<body>

<div id="shell" style="display:flex; flex-direction:column; height:100vh; background:#383c42; color:#e8eaed; font-family:'JetBrains Mono',monospace;">

  <!-- HEADER -->
  <div id="header" style="height:44px; background:#2e3236; border-bottom:1px solid #5a5f66; display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0;">
    <div style="display:flex; align-items:center; gap:6px; font-size:13px;">
      <span style="color:#86efac; font-weight:600; letter-spacing:0.06em;">KINDPOS</span>
      <span style="color:#5a5f66;">·</span>
      <span style="color:#e8eaed;">License Admin</span>
    </div>
    <div style="background:#4ade80; color:#22252a; font-size:10px; font-weight:700; padding:2px 7px; border-radius:3px; letter-spacing:0.08em;">LIVE</div>
  </div>

  <!-- BODY -->
  <div id="body" style="display:flex; flex:1; overflow:hidden;">

    <!-- SIDEBAR -->
    <div id="sidebar" style="width:200px; background:#22252a; border-right:1px solid #5a5f66; display:flex; flex-direction:column; flex-shrink:0;">

      <!-- Search bar -->
      <div style="padding:8px; border-bottom:1px solid #5a5f66; flex-shrink:0;">
        <input
          id="customer-search"
          type="text"
          placeholder="Search customers..."
          style="width:100%; background:#2e3236; border:1px solid #5a5f66; border-radius:4px; color:#e8eaed; font-family:'JetBrains Mono',monospace; font-size:11px; padding:5px 8px;"
        >
      </div>

      <!-- Customer list -->
      <div id="customer-list" style="flex:1; overflow-y:auto;">
        <div style="color:#e8eaed; text-align:center; padding:20px 12px; font-size:11px;">Loading...</div>
      </div>

      <!-- New customer (pinned) -->
      <div
        id="new-customer-btn"
        style="border-top:1px solid #5a5f66; padding:10px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; color:#e8eaed; font-size:12px; flex-shrink:0; background:transparent;"
        onmouseenter="this.style.background='#2e3236'"
        onmouseleave="this.style.background='transparent'"
        onclick="openNewCustomer()"
      >
        <span style="font-size:16px; line-height:1;">+</span>
        <span>New customer</span>
      </div>

    </div>

    <!-- MAIN -->
    <div id="main" style="flex:1; background:#383c42; display:flex; flex-direction:column; overflow:hidden;">
      <div id="profile-header" style="height:44px; background:#2e3236; border-bottom:1px solid #5a5f66; padding:10px 14px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <span style="color:#e8eaed; font-size:12px;">Select a customer</span>
      </div>
      <div id="terminal-cards" style="flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px;"></div>
    </div>

  </div>
</div>

<!-- OVERLAY BACKDROP -->
<div id="overlay-backdrop"
  style="position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; display:none;"
  onclick="closeOverlay()"></div>

<!-- OVERLAY PANEL -->
<div id="overlay-panel"
  style="position:fixed; bottom:0; left:0; right:0; max-height:90vh; overflow-y:auto; background:#2e3236; border-top:1px solid #5a5f66; border-radius:8px 8px 0 0; padding:20px; z-index:101; display:none; transition:transform 0.25s ease;">

  <!-- Header -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <span id="overlay-title" style="color:#86efac; font-size:13px; letter-spacing:0.08em; font-family:'JetBrains Mono',monospace;"></span>
    <span style="color:#e8eaed; font-size:20px; cursor:pointer; line-height:1;" onclick="closeOverlay()">×</span>
  </div>

  <!-- Form -->
  <div style="display:flex; flex-direction:column; gap:14px;">

    <!-- Row 1: Terminal Name + Node Number -->
    <div style="display:flex; gap:10px;">
      <div style="flex:2; display:flex; flex-direction:column;">
        <label style="color:#e8eaed; font-size:10px; letter-spacing:0.08em; margin-bottom:4px;">TERMINAL NAME</label>
        <input id="ov-terminal-name" type="text"
          style="background:#22252a; border:1px solid #5a5f66; border-radius:4px; padding:8px 10px; color:#86efac; font-size:12px; font-family:'JetBrains Mono',monospace; width:100%;">
      </div>
      <div style="flex:1; display:flex; flex-direction:column;">
        <label style="color:#e8eaed; font-size:10px; letter-spacing:0.08em; margin-bottom:4px;">NODE NUMBER</label>
        <input id="ov-node-number" type="number" min="1"
          style="background:#22252a; border:1px solid #5a5f66; border-radius:4px; padding:8px 10px; color:#86efac; font-size:12px; font-family:'JetBrains Mono',monospace; width:100%;">
      </div>
    </div>

    <!-- Row 2: Store Ref (read-only) -->
    <div style="display:flex; flex-direction:column;">
      <label style="color:#e8eaed; font-size:10px; letter-spacing:0.08em; margin-bottom:4px;">STORE REF</label>
      <input id="ov-store-ref" type="text" readonly
        style="background:#22252a; border:1px solid #5a5f66; border-radius:4px; padding:8px 10px; color:#e8eaed; font-size:12px; font-family:'JetBrains Mono',monospace; width:100%; cursor:default;">
    </div>

    <!-- Row 3: Prefix + SKU -->
    <div style="display:flex; gap:10px;">
      <div style="flex:1; display:flex; flex-direction:column;">
        <label style="color:#e8eaed; font-size:10px; letter-spacing:0.08em; margin-bottom:4px;">PREFIX</label>
        <input id="ov-prefix" type="text" maxlength="4"
          style="background:#22252a; border:1px solid #5a5f66; border-radius:4px; padding:8px 10px; color:#86efac; font-size:12px; font-family:'JetBrains Mono',monospace; width:100%;"
          oninput="this.value=this.value.toUpperCase()">
      </div>
      <div style="flex:2; display:flex; flex-direction:column;">
        <label style="color:#e8eaed; font-size:10px; letter-spacing:0.08em; margin-bottom:4px;">SKU</label>
        <input id="ov-sku" type="text"
          style="background:#22252a; border:1px solid #5a5f66; border-radius:4px; padding:8px 10px; color:#86efac; font-size:12px; font-family:'JetBrains Mono',monospace; width:100%;">
      </div>
    </div>

    <!-- Generated key box (hidden until key returned) -->
    <div id="ov-key-box" style="display:none; background:#22252a; border:1px solid #86efac; border-radius:4px; padding:12px;">
      <div style="color:#e8eaed; font-size:10px; letter-spacing:0.08em; margin-bottom:6px;">GENERATED KEY</div>
      <div id="ov-key-value" style="color:#22d3ee; font-size:13px; word-break:break-all; margin-bottom:8px;"></div>
      <button id="ov-copy-btn" onclick="copyKey()"
        style="background:#383c42; border:1px solid #5a5f66; color:#e8eaed; padding:5px 12px; border-radius:4px; font-size:11px; cursor:pointer; font-family:'JetBrains Mono',monospace; letter-spacing:0.06em;">COPY</button>
    </div>

    <!-- Inline error -->
    <div id="ov-error" style="display:none; color:#e8472a; font-size:11px;"></div>

    <!-- Action buttons (rendered by JS based on mode) -->
    <div id="ov-buttons" style="display:flex; gap:10px; margin-top:8px;"></div>

  </div>
</div>

<!-- NEW CUSTOMER BACKDROP -->
<div id="new-customer-backdrop"
  style="position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; display:none;"
  onclick="closeNewCustomer()"></div>

<!-- NEW CUSTOMER MODAL -->
<div id="new-customer-modal"
  style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:320px; background:#2e3236; border:1px solid #5a5f66; border-radius:8px; padding:20px; z-index:201; display:none;">

  <!-- Header -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <span style="color:#86efac; font-size:13px; letter-spacing:0.08em; font-family:'JetBrains Mono',monospace;">NEW CUSTOMER</span>
    <span style="color:#e8eaed; font-size:20px; cursor:pointer; line-height:1;" onclick="closeNewCustomer()">×</span>
  </div>

  <!-- Form -->
  <div style="display:flex; flex-direction:column; gap:14px;">

    <!-- Store Name -->
    <div style="display:flex; flex-direction:column;">
      <label style="color:#e8eaed; font-size:10px; letter-spacing:0.08em; margin-bottom:4px;">STORE NAME</label>
      <input id="nc-store-name" type="text" placeholder="Sammy's Pizza"
        style="background:#22252a; border:1px solid #5a5f66; border-radius:4px; padding:8px 10px; color:#86efac; font-size:12px; font-family:'JetBrains Mono',monospace; width:100%;">
    </div>

    <!-- Store Ref -->
    <div style="display:flex; flex-direction:column;">
      <label style="color:#e8eaed; font-size:10px; letter-spacing:0.08em; margin-bottom:2px;">STORE REF</label>
      <span style="color:#e8eaed; font-size:9px; opacity:0.6; margin-bottom:4px;">Unique ID, no spaces</span>
      <input id="nc-store-ref" type="text" placeholder="SAMMYS-WESTDULUTH"
        style="background:#22252a; border:1px solid #5a5f66; border-radius:4px; padding:8px 10px; color:#86efac; font-size:12px; font-family:'JetBrains Mono',monospace; width:100%;"
        oninput="this.value=this.value.toUpperCase().replace(/ /g,'-')">
    </div>

    <!-- Error -->
    <div id="nc-error" style="display:none; color:#e8472a; font-size:11px;"></div>

    <!-- Buttons -->
    <div style="display:flex; gap:10px; margin-top:8px;">
      <button onclick="closeNewCustomer()"
        style="background:#383c42; border:1px solid #5a5f66; color:#e8eaed; flex:1; padding:10px; border-radius:4px; font-size:12px; letter-spacing:0.06em; cursor:pointer; font-family:'JetBrains Mono',monospace;">CANCEL</button>
      <button onclick="createCustomer()"
        style="background:#86efac; color:#22252a; font-weight:600; flex:1; padding:10px; border-radius:4px; font-size:12px; letter-spacing:0.06em; cursor:pointer; border:none; font-family:'JetBrains Mono',monospace;">CREATE</button>
    </div>

  </div>
</div>

<script>
  let ADMIN_SECRET = '';
  const API = 'https://kindpos.com';

  let allCustomers = [];
  let activeRef = null;

  async function initializeConfig() {
    try {
      const res = await fetch(`${API}/api/admin/config`);
      if (res.ok) {
        const config = await res.json();
        ADMIN_SECRET = config.admin_secret || '';
      }
    } catch (err) {
      console.error('Failed to load admin config:', err);
    }
  }

  initializeConfig();

  function displayRef(store_ref) {
    return store_ref === '' ? 'UNGROUPED' : store_ref;
  }

  function sortCustomers(list) {
    return [...list].sort((a, b) => {
      if (a.store_ref === '' && b.store_ref !== '') return 1;
      if (a.store_ref !== '' && b.store_ref === '') return -1;
      return a.store_ref.localeCompare(b.store_ref);
    });
  }

  function renderCustomers(customers) {
    const listEl = document.getElementById('customer-list');
    listEl.innerHTML = '';

    if (customers.length === 0) {
      listEl.innerHTML = '<div style="color:#e8eaed; text-align:center; padding:20px 12px; font-size:11px;">No results</div>';
      return;
    }

    customers.forEach(c => {
      const ref = displayRef(c.store_ref);
      const termCount = Array.isArray(c.terminals) ? c.terminals.length : 0;
      const termLabel = termCount === 1 ? '1 terminal' : `${termCount} terminals`;
      const bottomLine = c.store_name ? `${c.store_name} · ${termLabel}` : termLabel;
      const isActive = c.store_ref === activeRef;

      const tab = document.createElement('div');
      tab.className = 'customer-tab';
      tab.dataset.ref = c.store_ref;
      tab.style.cssText = [
        'padding:10px 12px',
        `border-left:3px solid ${isActive ? '#86efac' : 'transparent'}`,
        'border-bottom:1px solid #2e3236',
        'cursor:pointer',
        `background:${isActive ? '#383c42' : 'transparent'}`,
      ].join(';');

      tab.innerHTML = `
        <div style="color:#86efac; font-size:11px; letter-spacing:0.06em; font-weight:500;">${ref}</div>
        <div style="color:#e8eaed; font-size:10px; margin-top:3px; opacity:0.75;">${bottomLine}</div>
      `;

      tab.addEventListener('mouseenter', () => {
        if (c.store_ref !== activeRef) tab.style.background = '#2e3236';
      });
      tab.addEventListener('mouseleave', () => {
        if (c.store_ref !== activeRef) tab.style.background = 'transparent';
      });
      tab.addEventListener('click', () => {
        activeRef = c.store_ref;
        document.querySelectorAll('.customer-tab').forEach(t => {
          t.style.background = 'transparent';
          t.style.borderLeftColor = 'transparent';
        });
        tab.style.background = '#383c42';
        tab.style.borderLeftColor = '#86efac';
        renderMain(c);
      });

      listEl.appendChild(tab);
    });
  }

  document.getElementById('customer-search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    const filtered = q
      ? allCustomers.filter(c =>
          c.store_ref.toLowerCase().includes(q) ||
          (c.store_name && c.store_name.toLowerCase().includes(q))
        )
      : allCustomers;
    renderCustomers(sortCustomers(filtered));
  });

  async function loadCustomers() {
    try {
      const res = await fetch(`${API}/api/admin/customers`, {
        headers: { Authorization: `Bearer ${ADMIN_SECRET}` }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      const data = await res.json();
      allCustomers = data.customers || [];
      renderCustomers(sortCustomers(allCustomers));
    } catch (err) {
      const listEl = document.getElementById('customer-list');
      listEl.innerHTML = `<div style="color:#e8472a; text-align:center; padding:20px 12px; font-size:11px;">${err.message}</div>`;
    }
  }

  loadCustomers();

  // ── Chunk 2: main panel ──────────────────────────────

  function renderMain(customer) {
    renderProfileHeader(customer);
    renderTerminalCards(customer);
  }

  function renderProfileHeader(customer) {
    const el = document.getElementById('profile-header');
    if (!customer) {
      el.style.justifyContent = 'center';
      el.innerHTML = '<span style="color:#e8eaed; font-size:12px;">Select a customer</span>';
      return;
    }
    el.style.justifyContent = 'space-between';
    const ref = displayRef(customer.store_ref);
    const termCount = Array.isArray(customer.terminals) ? customer.terminals.length : 0;
    const termLabel = termCount === 1 ? '1 terminal' : `${termCount} terminals`;
    const bottomLine = customer.store_name ? `${customer.store_name} · ${termLabel}` : termLabel;
    el.innerHTML = `
      <div>
        <div style="color:#86efac; font-size:12px; letter-spacing:0.06em; font-weight:500;">${ref}</div>
        <div style="color:#e8eaed; font-size:10px; margin-top:2px;">${bottomLine}</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button
          style="background:#86efac; color:#22252a; font-size:11px; padding:6px 12px; border-radius:4px; font-weight:600; letter-spacing:0.06em; cursor:pointer; border:none; font-family:'JetBrains Mono',monospace;"
          onclick="openOverlay()"
        >+ TERMINAL</button>
        <button
          style="background:#6b1a0e; color:#e8472a; font-size:11px; padding:6px 12px; border-radius:4px; font-weight:600; letter-spacing:0.06em; cursor:pointer; border:1px solid #e8472a; font-family:'JetBrains Mono',monospace;"
          onclick="deleteCustomer('${customer.store_ref}')"
        >DELETE PROFILE</button>
      </div>
    `;
  }

  function relativeTime(ts) {
    if (!ts) return 'Never';
    const diff = Math.floor((Date.now() - new Date(ts)) / 1000);
    if (diff < 60) return 'Just now';
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  }

  function termRow(label, value, valueColor) {
    return `<div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="color:#e8eaed; font-size:10px; letter-spacing:0.08em;">${label}</span>
      <span style="color:${valueColor}; font-size:11px;">${value}</span>
    </div>`;
  }

  function renderTerminalCards(customer) {
    const el = document.getElementById('terminal-cards');
    el.innerHTML = '';
    const terminals = customer && Array.isArray(customer.terminals) ? customer.terminals : [];
    if (terminals.length === 0) {
      el.innerHTML = '<div style="color:#e8eaed; text-align:center; font-size:12px; margin-top:20px;">No terminals</div>';
      return;
    }
    terminals.forEach(t => {
      const isActivated = String(t.status).toUpperCase() === 'ACTIVATED';
      const badgeBg    = isActivated ? '#166534' : '#7a4d00';
      const badgeColor = isActivated ? '#4ade80' : '#f5a623';
      const badgeText  = isActivated ? 'ACTIVATED' : 'PENDING';
      const name = t.terminal_name || (t.node_number != null ? `Terminal ${t.node_number}` : 'Terminal');
      const lsColor = t.last_seen ? '#86efac' : '#e8eaed';

      const card = document.createElement('div');
      card.style.cssText = 'background:#2e3236; border:1px solid #5a5f66; border-radius:6px; cursor:pointer;';
      card.innerHTML = `
        <div style="background:#22252a; padding:8px 12px; border-bottom:1px solid #5a5f66; border-radius:6px 6px 0 0; display:flex; justify-content:space-between; align-items:center;">
          <span style="color:#86efac; font-size:12px;">${name}</span>
          <span style="background:${badgeBg}; color:${badgeColor}; font-size:10px; padding:2px 8px; border-radius:3px; letter-spacing:0.06em;">${badgeText}</span>
        </div>
        <div style="padding:10px 12px; display:flex; flex-direction:column; gap:6px;">
          ${termRow('KEY',       t.license_key || '—', t.license_key ? '#22d3ee' : '#e8eaed')}
          ${termRow('MAC',       t.mac         || '—', t.mac         ? '#86efac' : '#e8eaed')}
          ${termRow('IP',        t.ip          || '—', t.ip          ? '#86efac' : '#e8eaed')}
          ${termRow('LAST SEEN', relativeTime(t.last_seen), lsColor)}
        </div>
      `;
      card.addEventListener('mouseenter', () => { card.style.borderColor = '#86efac'; });
      card.addEventListener('mouseleave', () => { card.style.borderColor = '#5a5f66'; });
      card.addEventListener('click', () => openEditOverlay(t));
      el.appendChild(card);
    });
  }

  // ── Chunk 3: overlay ────────────────────────────────

  let overlayMode = 'add';
  let overlayTerminal = null;
  let generatedKey = null;

  function showOvError(msg) {
    const el = document.getElementById('ov-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function clearOvError() {
    const el = document.getElementById('ov-error');
    el.textContent = '';
    el.style.display = 'none';
  }

  const BTN_BASE = "border-radius:4px; font-size:12px; letter-spacing:0.06em; cursor:pointer; font-family:'JetBrains Mono',monospace; flex:1; padding:10px; border:none;";

  function renderOverlayButtons() {
    const btns = document.getElementById('ov-buttons');
    if (overlayMode === 'add') {
      btns.innerHTML = `
        <button onclick="generateKey()"
          style="${BTN_BASE} background:#86efac; color:#22252a; font-weight:600;">GENERATE KEY</button>
        <button id="ov-save-btn" onclick="handleSaveTerminal()" disabled
          style="${BTN_BASE} background:#383c42; border:1px solid #5a5f66 !important; color:#e8eaed; opacity:0.5; cursor:not-allowed;">SAVE &amp; CLOSE</button>
      `;
    } else {
      btns.innerHTML = `
        <button onclick="handleSaveEdit()"
          style="${BTN_BASE} background:#86efac; color:#22252a; font-weight:600;">SAVE</button>
        <button onclick="handleRevoke()"
          style="${BTN_BASE} background:#6b1a0e; color:#e8472a; border:1px solid #e8472a !important;">REVOKE</button>
      `;
    }
  }

  function openOverlay() {
    overlayMode = 'add';
    overlayTerminal = null;
    generatedKey = null;
    const customer = allCustomers.find(c => c.store_ref === activeRef);
    document.getElementById('ov-terminal-name').value = '';
    document.getElementById('ov-node-number').value = '';
    document.getElementById('ov-store-ref').value = customer ? customer.store_ref : '';
    document.getElementById('ov-prefix').value = '';
    document.getElementById('ov-sku').value = 'KINDPOS-PI-5';
    document.getElementById('ov-key-box').style.display = 'none';
    document.getElementById('ov-key-value').textContent = '';
    document.getElementById('overlay-title').textContent = 'NEW TERMINAL';
    clearOvError();
    renderOverlayButtons();
    document.getElementById('overlay-backdrop').style.display = 'block';
    document.getElementById('overlay-panel').style.display = 'block';
  }

  function openEditOverlay(terminal) {
    overlayMode = 'edit';
    overlayTerminal = terminal;
    generatedKey = null;
    const customer = allCustomers.find(c => c.store_ref === activeRef);
    document.getElementById('ov-terminal-name').value = terminal.terminal_name || '';
    document.getElementById('ov-node-number').value = terminal.node_number ?? '';
    document.getElementById('ov-store-ref').value = terminal.store_ref !== undefined
      ? terminal.store_ref
      : (customer ? customer.store_ref : '');
    document.getElementById('ov-prefix').value = terminal.prefix || '';
    document.getElementById('ov-sku').value = terminal.sku || 'KINDPOS-PI-5';
    document.getElementById('ov-key-box').style.display = 'none';
    document.getElementById('ov-key-value').textContent = '';
    const name = terminal.terminal_name || `Terminal ${terminal.node_number}`;
    document.getElementById('overlay-title').textContent = `EDIT TERMINAL · ${name}`;
    clearOvError();
    renderOverlayButtons();
    document.getElementById('overlay-backdrop').style.display = 'block';
    document.getElementById('overlay-panel').style.display = 'block';
  }

  function closeOverlay() {
    document.getElementById('overlay-backdrop').style.display = 'none';
    document.getElementById('overlay-panel').style.display = 'none';
    clearOvError();
    generatedKey = null;
  }

  function copyKey() {
    if (!generatedKey) return;
    navigator.clipboard.writeText(generatedKey);
    const btn = document.getElementById('ov-copy-btn');
    btn.textContent = 'COPIED!';
    setTimeout(() => { btn.textContent = 'COPY'; }, 1500);
  }

  async function generateKey() {
    const prefix      = document.getElementById('ov-prefix').value.trim();
    const node_number = document.getElementById('ov-node-number').value;
    const sku         = document.getElementById('ov-sku').value.trim();
    const store_ref   = document.getElementById('ov-store-ref').value;
    if (!prefix || !node_number || !sku) {
      showOvError('Fill in prefix, node number, and SKU first.');
      return;
    }
    clearOvError();
    try {
      const res = await fetch(`${API}/api/admin/generate`, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${ADMIN_SECRET}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ prefix, node_number: Number(node_number), sku, store_ref }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      const data = await res.json();
      generatedKey = data.code;
      document.getElementById('ov-key-value').textContent = generatedKey;
      document.getElementById('ov-key-box').style.display = 'block';
      const saveBtn = document.getElementById('ov-save-btn');
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.style.opacity = '1';
        saveBtn.style.cursor = 'pointer';
      }
    } catch (err) {
      showOvError(err.message);
    }
  }

  async function saveTerminal() {
    if (!generatedKey) {
      showOvError('Generate a key first.');
      return false;
    }
    const customer = allCustomers.find(c => c.store_ref === activeRef);
    if (!customer) return false;
    const terminal_name = document.getElementById('ov-terminal-name').value.trim();
    const node_number   = Number(document.getElementById('ov-node-number').value);
    const terminal_data = {
      license_key: generatedKey,
      store_ref: document.getElementById('ov-store-ref').value,
      terminal_name: terminal_name || `Terminal ${node_number}`,
      node_number,
      prefix: document.getElementById('ov-prefix').value.trim(),
      sku: document.getElementById('ov-sku').value.trim()
    };

    customer.terminals = customer.terminals || [];
    customer.terminals.push(terminal_data);

    try {
      const res = await fetch(`${API}/api/admin/terminals`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${ADMIN_SECRET}`
        },
        body: JSON.stringify(terminal_data)
      });
      if (!res.ok) {
        customer.terminals.pop();
        showOvError('Failed to save terminal.');
        return false;
      }
      customer.terminals[customer.terminals.length - 1] = await res.json();
      renderMain(customer);
      renderCustomers(sortCustomers(allCustomers));
      return true;
    } catch (err) {
      customer.terminals.pop();
      showOvError('Network error.');
      return false;
    }
  }

  async function handleSaveTerminal() {
    const ok = await saveTerminal();
    if (ok) closeOverlay();
  }

  async function saveEdit() {
    const customer = allCustomers.find(c => c.store_ref === activeRef);
    if (customer) renderMain(customer);
  }

  async function handleSaveEdit() {
    if (!overlayTerminal) return;
    const license_key = overlayTerminal.license_key;
    const terminal_name = document.getElementById('ov-terminal-name').value.trim();
    const node_number = Number(document.getElementById('ov-node-number').value) || null;
    const prefix = document.getElementById('ov-prefix').value.trim();
    const sku = document.getElementById('ov-sku').value.trim();

    try {
      const res = await fetch(`${API}/api/admin/terminals/${encodeURIComponent(license_key)}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${ADMIN_SECRET}`
        },
        body: JSON.stringify({ terminal_name, node_number, prefix, sku })
      });
      if (!res.ok) {
        const e = await res.json();
        showOvError(e.error || 'Save failed');
        return;
      }
      const updated = await res.json();
      const cust = allCustomers.find(c => c.store_ref === updated.store_ref);
      if (cust) {
        const idx = cust.terminals.findIndex(t => t.license_key === license_key);
        if (idx >= 0) cust.terminals[idx] = updated;
      }
      closeOverlay();
    } catch (err) {
      showOvError('Network error.');
    }
  }

  async function revokeTerminal() {
    try {
      const res = await fetch(`${API}/api/admin/revoke`, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${ADMIN_SECRET}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ license_key: overlayTerminal.license_key }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      const customer = allCustomers.find(c => c.store_ref === activeRef);
      if (customer) {
        customer.terminals = customer.terminals.filter(
          t => t.license_key !== overlayTerminal.license_key
        );
        renderMain(customer);
      }
      return true;
    } catch (err) {
      showOvError(err.message);
      return false;
    }
  }

  async function handleRevoke() {
    if (!confirm('Revoke this license?')) return;
    const ok = await revokeTerminal();
    if (ok) closeOverlay();
  }

  async function deleteCustomer(store_ref) {
    if (!confirm('Delete this profile and revoke all keys? This cannot be undone.')) return;
    try {
      const res = await fetch(`${API}/api/admin/customers/${encodeURIComponent(store_ref)}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${ADMIN_SECRET}` }
      });
      if (!res.ok) {
        const e = await res.json().catch(() => ({}));
        alert(e.error || `Delete failed (HTTP ${res.status})`);
        return;
      }
      allCustomers = allCustomers.filter(c => c.store_ref !== store_ref);
      if (activeRef === store_ref) activeRef = null;
      renderCustomers(sortCustomers(allCustomers));
      renderMain(null);
    } catch (err) {
      alert('Network error: ' + err.message);
    }
  }

  // ── New Customer modal ───────────────────────────────

  function openNewCustomer() {
    document.getElementById('nc-store-name').value = '';
    document.getElementById('nc-store-ref').value = '';
    const errEl = document.getElementById('nc-error');
    errEl.textContent = '';
    errEl.style.display = 'none';
    document.getElementById('new-customer-backdrop').style.display = 'block';
    document.getElementById('new-customer-modal').style.display = 'block';
  }

  function closeNewCustomer() {
    document.getElementById('new-customer-backdrop').style.display = 'none';
    document.getElementById('new-customer-modal').style.display = 'none';
    const errEl = document.getElementById('nc-error');
    errEl.textContent = '';
    errEl.style.display = 'none';
  }

  async function createCustomer() {
    const store_name = document.getElementById('nc-store-name').value.trim();
    const store_ref  = document.getElementById('nc-store-ref').value.trim();
    const errEl = document.getElementById('nc-error');

    function ncErr(msg) {
      errEl.textContent = msg;
      errEl.style.display = 'block';
    }

    if (!store_name || !store_ref) { ncErr('Both fields are required.'); return; }
    if (/\s/.test(store_ref))      { ncErr('Store Ref must not contain spaces.'); return; }
    if (allCustomers.some(c => c.store_ref.toUpperCase() === store_ref.toUpperCase())) {
      ncErr('Store Ref already exists.');
      return;
    }

    try {
      const res = await fetch(`${API}/api/admin/customers`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${ADMIN_SECRET}`
        },
        body: JSON.stringify({ store_ref: store_ref.toUpperCase(), store_name })
      });
      if (!res.ok) {
        const e = await res.json();
        ncErr(e.error || 'Server error');
        return;
      }
      const newCustomer = await res.json();
      allCustomers.push(newCustomer);
      activeRef = newCustomer.store_ref;
      renderCustomers(sortCustomers(allCustomers));
      renderMain(newCustomer);
      closeNewCustomer();
    } catch (err) {
      ncErr('Network error.');
    }
  }
</script>

</body>
</html>
